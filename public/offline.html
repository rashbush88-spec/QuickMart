<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Connection - QuickMart POS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="flag-stripe">
      <div class="red"></div><div class="gold"></div><div class="green"></div>
    </div>
    <div class="login-card-body" style="text-align:center">
      <div style="font-size:52px;margin-bottom:12px">&#128246;</div>
      <h2 style="font-size:20px;color:var(--gray-900);margin-bottom:8px">No connection</h2>
      <p style="color:var(--gray-500);font-size:15px;margin-bottom:24px">
        QuickMart needs the internet to record sales and update stock.
        Your data is safe on the server; nothing has been lost.
      </p>
      <button class="btn btn-primary" style="width:100%" onclick="location.reload()">
        Try Again
      </button>
    </div>
  </div>
</body>
</html>
